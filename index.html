<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliveira Apps | Portal de Acesso</title>
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-color: #0066cc;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --error-color: #dc3545;
            --success-color: #28a745;
            --border-radius: 8px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .auth-container {
            background: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 1.5rem;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: 0.3s;
        }

        .tab.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            box-sizing: border-box;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(0,102,204,0.2);
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 1rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #0052a3;
        }

        .btn-google {
            background-color: white;
            color: #555;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            background-color: #f1f1f1;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 0.8rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .status-message {
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            margin-top: 1rem;
        }

        /* Dash Area */
        #dashboard {
            display: none;
            text-align: center;
        }

        .user-info {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #999;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="logo-area">
        <h1>OLIVEIRA APPS</h1>
    </div>

    <div id="auth-forms">
        <div class="tabs">
            <div class="tab active" id="tab-login" onclick="switchMode('login')">LOGIN</div>
            <div class="tab" id="tab-register" onclick="switchMode('register')">CADASTRO</div>
        </div>

        <div id="error-display" class="error-message"></div>

        <!-- LOGIN FORM -->
        <div id="login-section">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="login-id" placeholder="Ex: joao@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="login-pass" placeholder="Sua senha">
            </div>
            <button class="btn btn-primary" onclick="handleAuth('login')">ENTRAR NO PORTAL</button>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-section" style="display: none;">
            <div class="form-group">
                <label>Nome completo</label>
                <input type="text" id="reg-name" placeholder="Como quer ser chamado?">
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="reg-email" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="form-group">
                <label>Gênero</label>
                <select id="reg-gender">
                    <option value="">Selecione...</option>
                    <option value="menino">Masculino (Menino)</option>
                    <option value="menina">Feminino (Menina)</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="handleAuth('register')">CRIAR MINHA CONTA</button>
        </div>

        <div style="text-align: center; margin: 1rem 0; color: #999; font-size: 0.9rem;">OU</div>

        <button class="btn btn-google" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
            ENTRAR RÁPIDO COM GOOGLE
        </button>

        <p class="status-message" id="status-text">Status: Sistema Online</p>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard">
        <h2>ACESSO LIBERADO</h2>
        <div class="user-info">
            <p>Olá, <strong id="display-name">Usuário</strong>!</p>
            <p id="display-email" style="font-size: 0.9rem; color: #666;"></p>
        </div>
        <button class="btn btn-primary" onclick="window.location.href='https://github.com/miolanatan9-debug/gravador-super-v2-final/releases/latest'">BAIXAR GRAVADOR SUPER V2</button>
        <button class="btn" style="background: #eee;" onclick="logout()">SAIR DO SISTEMA</button>
    </div>

    <div class="footer">Oliveira Apps &copy; 2026 - Sinceridade Absoluta</div>
</div>

<script>
    // CONFIGURAÇÃO DO SUPABASE
    const SUPABASE_URL = 'https://xioxooqytfxsjdoqghdu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_CAJTTExGFYQIzmNlF6N1Xw_QKqOBUFA';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function switchMode(mode) {
        document.getElementById('login-section').style.display = mode === 'login' ? 'block' : 'none';
        document.getElementById('register-section').style.display = mode === 'register' ? 'block' : 'none';
        document.getElementById('tab-login').className = mode === 'login' ? 'tab active' : 'tab';
        document.getElementById('tab-register').className = mode === 'register' ? 'tab active' : 'tab';
        hideError();
    }

    function showError(msg) {
        const errDiv = document.getElementById('error-display');
        errDiv.innerText = msg;
        errDiv.style.display = 'block';
    }

    function hideError() {
        document.getElementById('error-display').style.display = 'none';
    }

    async function handleAuth(mode) {
        hideError();
        if (mode === 'register') {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const gender = document.getElementById('reg-gender').value;

            if (!name || !email || !pass || !gender) return showError("Preencha todos os campos.");
            if (pass.length < 6) return showError("A senha deve ter pelo menos 6 caracteres.");

            const { data, error } = await supabase.auth.signUp({
                email,
                password: pass,
                options: {
                    data: { name, gender }
                }
            });

            if (error) showError(error.message);
            else alert("Cadastro realizado! Verifique seu e-mail (se necessário) ou faça login.");

        } else {
            const email = document.getElementById('login-id').value;
            const pass = document.getElementById('login-pass').value;

            if (!email || !pass) return showError("Preencha e-mail e senha.");

            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password: pass
            });

            if (error) showError("E-mail ou senha incorretos.");
        }
    }

    async function loginWithGoogle() {
        hideError();
        const { data, error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
                redirectTo: window.location.href
            }
        });
        if (error) showError(error.message);
    }

    async function logout() {
        await supabase.auth.signOut();
        location.reload();
    }

    // Monitor de estado
    supabase.auth.onAuthStateChange((event, session) => {
        if (session && session.user) {
            const user = session.user;
            document.getElementById('auth-forms').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('display-name').innerText = user.user_metadata.name || user.email.split('@')[0];
            document.getElementById('display-email').innerText = user.email;
        } else {
            document.getElementById('auth-forms').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }
    });

    // Detecta offline
    window.addEventListener('offline', () => {
        document.getElementById('status-text').innerText = "Status: Sem conexão (Offline)";
        document.getElementById('status-text').style.color = "red";
    });
    window.addEventListener('online', () => {
        document.getElementById('status-text').innerText = "Status: Sistema Online";
        document.getElementById('status-text').style.color = "#666";
    });
</script>

</body>
</html>
