<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliveira Apps | Portal v10 (Ultra-Lightweight)</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #111;
            --primary: #00ff00;
            --text: #eee;
            --muted: #666;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: var(--primary);
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        .card {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 8px;
            color: var(--muted);
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #333;
            color: var(--primary);
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
        }
        input:focus {
            border-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            text-transform: uppercase;
            transition: 0.2s;
        }
        button:hover {
            background: #00cc00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        }
        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        #portal-content {
            display: none;
        }
        .app-card {
            border: 1px solid #333;
            padding: 20px;
            margin-top: 20px;
            background: #000;
            text-align: left;
        }
        .app-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            display: block;
        }
        .app-status {
            font-size: 0.8rem;
            color: #f1c40f;
            margin-bottom: 15px;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.7rem;
            color: var(--muted);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>OLIVEIRA APPS</h1>

    <div id="login-section" class="card">
        <div class="form-group">
            <label>Identificação de Usuário</label>
            <input type="text" id="username" placeholder="Digite seu username" autocomplete="off">
        </div>
        <button onclick="login()">Acessar Portal</button>
    </div>

    <div id="portal-content" class="card">
        <p style="font-size: 0.9rem; margin-bottom: 20px;">Bem-vindo, <span id="display-user" style="color: var(--primary);"></span>.</p>
        
        <div class="app-card">
            <span class="app-title">Gravador Super v2.5</span>
            <div class="app-status">Status: Aguardando nova versão estável...</div>
            <button disabled>Indisponível</button>
        </div>

        <button onclick="logout()" style="background: transparent; color: #666; margin-top: 20px; font-size: 0.7rem; border: 1px solid #333; padding: 10px;">Sair</button>
    </div>

    <div class="footer">
        SINCERIDADE ABSOLUTA &copy; 2026
    </div>
</div>

<script>
    function login() {
        const user = document.getElementById('username').value;
        if (user.trim().length > 0) {
            localStorage.setItem('oliveira_user', user);
            showPortal(user);
        } else {
            alert('Por favor, insira seu username.');
        }
    }

    function logout() {
        localStorage.removeItem('oliveira_user');
        location.reload();
    }

    function showPortal(user) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('portal-content').style.display = 'block';
        document.getElementById('display-user').innerText = user;
    }

    window.onload = () => {
        const savedUser = localStorage.getItem('oliveira_user');
        if (savedUser) {
            showPortal(savedUser);
        }
    }
</script>

</body>
</html>
