<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliveira Apps | Portal Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff00;
            --bg: #0a0a0a;
            --card-bg: #151515;
            --text: #ffffff;
            --error: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
        }

        .tab {
            flex: 1;
            padding: 12px;
            cursor: pointer;
            color: #888;
            transition: 0.3s;
            font-weight: 600;
        }

        .tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,255,0,0.3);
        }

        .btn-google {
            background: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .error-msg {
            color: var(--error);
            font-size: 13px;
            margin-top: 5px;
            display: none;
            height: 16px;
        }

        #logged-in-area {
            display: none;
        }

        .welcome-card {
            background: #111;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            margin-top: 20px;
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #555;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container" id="auth-area">
        <h1>OLIVEIRA APPS</h1>
        
        <div class="tabs">
            <div class="tab active" id="login-tab" onclick="switchTab('login')">LOGIN</div>
            <div class="tab" id="register-tab" onclick="switchTab('register')">CADASTRO</div>
        </div>

        <!-- LOGIN FORM -->
        <div id="login-form">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="login-email" placeholder="Seu e-mail">
                <div class="error-msg" id="login-email-error"></div>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="login-pass" placeholder="Sua senha">
                <div class="error-msg" id="login-pass-error"></div>
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">ENTRAR</button>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-form" style="display: none;">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="reg-email" placeholder="Seu e-mail">
                <div class="error-msg" id="reg-email-error"></div>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="reg-pass" placeholder="Mínimo 8 caracteres">
                <div class="error-msg" id="reg-pass-error"></div>
            </div>
            <button class="btn btn-primary" onclick="handleRegister()">CRIAR CONTA</button>
        </div>

        <button class="btn btn-google" onclick="handleGoogleLogin()">
            <img src="https://www.google.com/favicon.ico" width="18">
            ENTRAR COM GOOGLE
        </button>
    </div>

    <div class="container" id="logged-in-area">
        <h1>BEM-VINDO</h1>
        <div class="welcome-card">
            <p id="user-display">Operador conectado</p>
        </div>
        <button class="btn btn-primary" style="margin-top: 30px;" onclick="window.location.href='https://github.com/miolanatan9-debug/gravador-super-v2-final/releases/latest'">BAIXAR GRAVADOR SUPER V2</button>
        <button class="btn" style="background:#333; color:#fff; margin-top:15px;" onclick="handleLogout()">SAIR</button>
    </div>

    <div class="footer">SINCERIDADE ABSOLUTA</div>

    <script>
        // CONFIGURAÇÃO FIREBASE (Drop keys here)
        // const firebaseConfig = { ... };
        
        function switchTab(type) {
            document.getElementById('login-tab').classList.toggle('active', type === 'login');
            document.getElementById('register-tab').classList.toggle('active', type === 'register');
            document.getElementById('login-form').style.display = type === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = type === 'register' ? 'block' : 'none';
            clearErrors();
        }

        function clearErrors() {
            document.querySelectorAll('.error-msg').forEach(e => e.style.display = 'none');
        }

        function showError(id, msg) {
            const el = document.getElementById(id);
            el.innerText = msg;
            el.style.display = 'block';
        }

        async function handleLogin() {
            clearErrors();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            
            if(!email) return showError('login-email-error', 'E-mail obrigatório');
            if(!pass) return showError('login-pass-error', 'Senha obrigatória');

            // Aqui entra a chamada real do Firebase (signInWithEmailAndPassword)
            // Por enquanto, simulamos o erro se não houver config
            console.log("Tentando login online...");
            alert("SISTEMA ONLINE EM CONFIGURAÇÃO. Conectando ao Firebase...");
        }

        async function handleRegister() {
            clearErrors();
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;

            if(!email) return showError('reg-email-error', 'E-mail obrigatório');
            if(pass.length < 8) return showError('reg-pass-error', 'Senha deve ter 8+ caracteres');

            alert("CRIANDO CONTA ONLINE... Aguarde conexão Firebase.");
        }

        async function handleGoogleLogin() {
            // Aqui entra a chamada real (signInWithPopup)
            alert("SOLICITANDO LOGIN GOOGLE... Selecione sua conta na janela que abrir.");
        }

        function handleLogout() {
            location.reload();
        }
    </script>
</body>
</html>
