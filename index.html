<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliveira Apps | Portal de Acesso</title>
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-color: #0066cc;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --error-color: #dc3545;
            --success-color: #28a745;
            --border-radius: 8px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .auth-container {
            background: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tabs {
            display: none; /* Escondi as abas para usar o link de alternar */
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 1rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-google {
            background-color: white;
            color: #555;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 0.8rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .switch-link {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .switch-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        #dashboard {
            display: none;
            text-align: center;
        }

        .user-info {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="logo-area">
        <h1>OLIVEIRA APPS</h1>
    </div>

    <div id="auth-forms">
        <div id="error-display" class="error-message"></div>

        <!-- LOGIN FORM -->
        <div id="login-section">
            <div class="form-group">
                <label>E-mail ou Usuário</label>
                <input type="text" id="login-id" placeholder="Digite seu e-mail">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="login-pass" placeholder="Sua senha">
            </div>
            <button class="btn btn-primary" onclick="handleAuth('login')">ENTRAR</button>
            <div class="switch-link">Não tem uma conta? <a href="#" onclick="switchMode('register')">Cadastre-se</a></div>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-section" style="display: none;">
            <div class="form-group">
                <label>Nome de usuário</label>
                <input type="text" id="reg-username" placeholder="Escolha um nome">
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="reg-email" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="form-group">
                <label>Digite novamente a senha</label>
                <input type="password" id="reg-pass-confirm" placeholder="Confirme sua senha">
            </div>
            <div class="form-group">
                <label>Gênero</label>
                <select id="reg-gender">
                    <option value="">Selecione...</option>
                    <option value="menino">Menino</option>
                    <option value="menina">Menina</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="handleAuth('register')">CRIAR CONTA</button>
            <div class="switch-link">Já tem conta? <a href="#" onclick="switchMode('login')">Fazer Login</a></div>
        </div>

        <div style="text-align: center; margin: 1rem 0; color: #999; font-size: 0.9rem;">OU</div>

        <button class="btn btn-google" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
            ENTRAR COM O GOOGLE
        </button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
        <h2>ACESSO LIBERADO</h2>
        <div class="user-info">
            <p>Olá, <strong id="display-name">Usuário</strong>!</p>
            <p id="display-email"></p>
        </div>
        <button class="btn btn-primary" onclick="window.location.href='https://github.com/miolanatan9-debug/gravador-super-v2-final/releases/latest'">BAIXAR APK</button>
        <button class="btn" onclick="logout()">SAIR</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://xioxooqytfxsjdoqghdu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_CAJTTExGFYQIzmNlF6N1Xw_QKqOBUFA';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function switchMode(mode) {
        document.getElementById('login-section').style.display = mode === 'login' ? 'block' : 'none';
        document.getElementById('register-section').style.display = mode === 'register' ? 'block' : 'none';
        hideError();
    }

    function showError(msg) {
        const errDiv = document.getElementById('error-display');
        errDiv.innerText = msg;
        errDiv.style.display = 'block';
    }

    function hideError() {
        document.getElementById('error-display').style.display = 'none';
    }

    async function handleAuth(mode) {
        hideError();
        if (mode === 'register') {
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const confirm = document.getElementById('reg-pass-confirm').value;
            const gender = document.getElementById('reg-gender').value;

            if (!username || !email || !pass || !confirm || !gender) return showError("Preencha tudo!");
            if (pass !== confirm) return showError("As senhas não batem!");
            if (pass.length < 6) return showError("Senha curta (mínimo 6)!");

            const { data, error } = await supabase.auth.signUp({
                email,
                password: pass,
                options: { data: { username, gender } }
            });

            if (error) showError(error.message);
            else alert("Conta criada! Verifique seu e-mail.");

        } else {
            const id = document.getElementById('login-id').value;
            const pass = document.getElementById('login-pass').value;
            const { data, error } = await supabase.auth.signInWithPassword({ email: id, password: pass });
            if (error) showError("Erro no login. Verifique os dados.");
        }
    }

    async function loginWithGoogle() {
        const { error } = await supabase.auth.signInWithOAuth({ 
            provider: 'google',
            options: { redirectTo: window.location.href }
        });
        if (error) showError(error.message);
    }

    async function logout() {
        await supabase.auth.signOut();
        location.reload();
    }

    supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
            document.getElementById('auth-forms').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            const meta = session.user.user_metadata;
            document.getElementById('display-name').innerText = meta.username || session.user.email;
            document.getElementById('display-email').innerText = session.user.email;
        }
    });
</script>
</body>
</html>
