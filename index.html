<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliveira Apps | Portal de Acesso</title>
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-color: #0066cc;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --error-color: #dc3545;
            --success-color: #28a745;
            --border-radius: 8px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .auth-container {
            background: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 1rem;
            display: block;
            text-align: center;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #0052a3;
        }

        .btn-google {
            background-color: white;
            color: #555;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            background-color: #f1f1f1;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 0.8rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .switch-link {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .switch-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .divider {
            text-align: center;
            margin: 1.5rem 0;
            position: relative;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #ddd;
            z-index: 1;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            position: relative;
            z-index: 2;
            color: #999;
            font-size: 0.8rem;
        }

        #dashboard {
            display: none;
            text-align: center;
        }

        .user-info {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="logo-area">
        <h1>OLIVEIRA APPS</h1>
    </div>

    <div id="auth-forms">
        <div id="error-display" class="error-message"></div>

        <!-- LOGIN SCREEN -->
        <div id="login-section">
            <div class="form-group">
                <label>Nome de usuário ou E-mail</label>
                <input type="text" id="login-id" placeholder="Digite seu usuário ou e-mail">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="login-pass" placeholder="Sua senha">
            </div>
            <button class="btn btn-primary" id="btn-login">ENTRAR</button>
            
            <div class="divider"><span>OU</span></div>
            
            <button class="btn btn-google btn-google-login">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
                Entrar com o Google
            </button>
            
            <div class="switch-link">Não tem uma conta? <a href="#" id="link-to-register">Cadastre-se</a></div>
        </div>

        <!-- REGISTER SCREEN -->
        <div id="register-section" style="display: none;">
            <div class="form-group">
                <label>Nome de usuário</label>
                <input type="text" id="reg-username" placeholder="Escolha um nome">
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="reg-email" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="form-group">
                <label>Digite novamente a senha</label>
                <input type="password" id="reg-pass-confirm" placeholder="Confirme sua senha">
            </div>
            <div class="form-group">
                <label>Gênero</label>
                <select id="reg-gender">
                    <option value="">Selecione...</option>
                    <option value="Menino">Menino</option>
                    <option value="Menina">Menina</option>
                </select>
            </div>
            <button class="btn btn-primary" id="btn-register">CRIAR CONTA</button>

            <div class="divider"><span>OU MAIS RÁPIDO</span></div>

            <button class="btn btn-google btn-google-register">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
                Entrar com o Google
            </button>

            <div class="switch-link">Já tem conta? <a href="#" id="link-to-login">Fazer Login</a></div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
        <h2>ACESSO LIBERADO</h2>
        <div class="user-info">
            <p>Olá, <strong id="display-name">Usuário</strong>!</p>
            <p id="display-email"></p>
        </div>
        <a href="https://github.com/miolanatan9-debug/gravador-super-v2-final/releases/latest" class="btn btn-primary">BAIXAR APK</a>
        <button class="btn" id="btn-logout">SAIR</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://xioxooqytfxsjdoqghdu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_CAJTTExGFYQIzmNlF6N1Xw_QKqOBUFA';
    
    // Corect Initialization according to requirements
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Elements
    const loginSection = document.getElementById('login-section');
    const registerSection = document.getElementById('register-section');
    const errorDisplay = document.getElementById('error-display');
    const dashboard = document.getElementById('dashboard');
    const authForms = document.getElementById('auth-forms');

    // Navigation
    document.getElementById('link-to-register').addEventListener('click', (e) => {
        e.preventDefault();
        loginSection.style.display = 'none';
        registerSection.style.display = 'block';
        hideError();
    });

    document.getElementById('link-to-login').addEventListener('click', (e) => {
        e.preventDefault();
        registerSection.style.display = 'none';
        loginSection.style.display = 'block';
        hideError();
    });

    function showError(msg) {
        errorDisplay.innerText = msg;
        errorDisplay.style.display = 'block';
    }

    function hideError() {
        errorDisplay.style.display = 'none';
    }

    // Auth Functions
    async function loginWithGoogle() {
        try {
            const { error } = await supabaseClient.auth.signInWithOAuth({ 
                provider: 'google',
                options: { redirectTo: window.location.href }
            });
            if (error) throw error;
        } catch (error) {
            showError(error.message);
        }
    }

    document.querySelectorAll('.btn-google').forEach(btn => {
        btn.addEventListener('click', loginWithGoogle);
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
        const emailOrUser = document.getElementById('login-id').value;
        const pass = document.getElementById('login-pass').value;

        if (!emailOrUser || !pass) return showError("Preencha todos os campos.");

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailOrUser,
                password: pass
            });
            if (error) throw error;
        } catch (error) {
            showError("Erro no login: " + error.message);
        }
    });

    document.getElementById('btn-register').addEventListener('click', async () => {
        const username = document.getElementById('reg-username').value;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-pass').value;
        const confirm = document.getElementById('reg-pass-confirm').value;
        const gender = document.getElementById('reg-gender').value;

        if (!username || !email || !pass || !confirm || !gender) return showError("Preencha todos os campos!");
        if (pass !== confirm) return showError("As senhas não coincidem!");
        if (pass.length < 6) return showError("A senha deve ter pelo menos 6 caracteres.");

        try {
            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password: pass,
                options: { 
                    data: { 
                        username: username, 
                        gender: gender 
                    } 
                }
            });
            if (error) throw error;
            alert("Cadastro realizado! Verifique seu e-mail para confirmar a conta.");
        } catch (error) {
            showError("Erro no cadastro: " + error.message);
        }
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.reload();
    });

    // Handle Auth State Change
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
            authForms.style.display = 'none';
            dashboard.style.display = 'block';
            
            const user = session.user;
            const meta = user.user_metadata;
            
            document.getElementById('display-name').innerText = meta.username || user.email;
            document.getElementById('display-email').innerText = user.email;
        } else {
            authForms.style.display = 'block';
            dashboard.style.display = 'none';
        }
    });
</script>
</body>
</html>
