<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliveira Apps Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <!-- Header with Pulse Indicator -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 bg-green-500 rounded-full pulse"></div>
            <span class="text-xs font-bold text-green-600 uppercase tracking-widest">Online</span>
        </div>
        <h1 class="text-xl font-extrabold tracking-tight text-slate-800">OLIVEIRA APPS</h1>
        <button id="logoutBtn" class="hidden text-sm font-semibold text-slate-500 hover:text-red-600 transition-colors">Sair</button>
    </header>

    <main class="container mx-auto px-4 py-12 flex flex-col items-center justify-center">
        
        <!-- Registration Form -->
        <div id="registerView" class="w-full max-w-md bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-slate-800">Criar Nova Conta</h2>
                <p class="text-slate-500 text-sm mt-1">Junte-se à nossa comunidade</p>
            </div>
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nome de Usuário</label>
                    <input type="text" id="regUsername" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">E-mail</label>
                    <input type="email" id="regEmail" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Gênero</label>
                    <select id="regGender" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all appearance-none bg-white">
                        <option value="">Selecione...</option>
                        <option value="Menino">Menino</option>
                        <option value="Menina">Menina</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Senha</label>
                    <input type="password" id="regPassword" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Confirmar Senha</label>
                    <input type="password" id="regConfirmPassword" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-blue-200 active:scale-95">CRIAR CONTA</button>
            </form>
            <p class="mt-6 text-center text-sm text-slate-500">
                Já possui uma conta? <button onclick="showView('loginView')" class="text-blue-600 font-bold hover:underline">Entrar</button>
            </p>
        </div>

        <!-- Login Form -->
        <div id="loginView" class="hidden w-full max-w-md bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-slate-800">Bem-vindo de Volta</h2>
                <p class="text-slate-500 text-sm mt-1">Acesse sua conta para continuar</p>
            </div>
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">E-mail</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Senha</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-blue-200 active:scale-95">ENTRAR</button>
            </form>
            <p class="mt-6 text-center text-sm text-slate-500">
                Não tem uma conta? <button onclick="showView('registerView')" class="text-blue-600 font-bold hover:underline">Criar Conta</button>
            </p>
        </div>

        <!-- Dashboard -->
        <div id="dashboardView" class="hidden w-full max-w-4xl space-y-8">
            <div class="bg-white rounded-3xl p-10 shadow-xl shadow-slate-200/50 border border-slate-100 text-center">
                <h2 class="text-4xl font-black text-slate-800">Bem-vindo, <span id="dashUsername" class="text-blue-600">...</span>!</h2>
                <p class="text-slate-500 mt-3 text-lg">Seu acesso exclusivo ao portal Oliveira Apps.</p>
                
                <div class="mt-12">
                    <a href="https://github.com/miolanatan9-debug/gravador-super-v2-final/releases/latest" class="inline-flex items-center px-10 py-5 bg-emerald-500 hover:bg-emerald-600 text-white text-xl font-black rounded-2xl transition-all shadow-xl shadow-emerald-200 hover:-translate-y-1 active:scale-95 group">
                        <svg class="w-7 h-7 mr-3 group-hover:animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        BAIXAR APK
                    </a>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Total Visits -->
                <div class="bg-white rounded-3xl p-8 shadow-lg shadow-slate-100 border border-slate-100 flex flex-col items-center justify-center space-y-2">
                    <span class="text-slate-400 text-xs font-black uppercase tracking-widest">Total de Visitas</span>
                    <span id="totalVisits" class="text-6xl font-black text-slate-800">...</span>
                </div>
                
                <!-- Last 5 Logins -->
                <div class="bg-white rounded-3xl p-8 shadow-lg shadow-slate-100 border border-slate-100">
                    <h3 class="text-slate-400 text-xs font-black uppercase tracking-widest mb-6 text-center">Últimos Logins</h3>
                    <ul id="lastLogins" class="divide-y divide-slate-50">
                        <li class="py-3 text-center text-slate-400 italic">Carregando...</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <script>
        // STRICT TECHNICAL STACK
        const URL = 'https://xioxooqytfxsjdoqghdu.supabase.co';
        const KEY = 'sb_publishable_CAJTTExGFYQIzmNlF6N1Xw_QKqOBUFA';
        const { createClient } = supabase;
        const supabaseClient = createClient(URL, KEY);

        // View Control
        function showView(viewId) {
            document.getElementById('registerView').classList.add('hidden');
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (viewId === 'dashboardView') {
                logoutBtn.classList.remove('hidden');
            } else {
                logoutBtn.classList.add('hidden');
            }
        }

        // Stats Logic
        async function updateStats(username) {
            try {
                // Track this login/session
                await supabaseClient.from('portal_activity').insert([{ username: username, event: 'login' }]);
                
                // Get total count
                const { count } = await supabaseClient.from('portal_activity').select('*', { count: 'exact', head: true });
                document.getElementById('totalVisits').innerText = count || 0;

                // Get last 5
                const { data } = await supabaseClient.from('portal_activity')
                    .select('username')
                    .order('created_at', { ascending: false })
                    .limit(5);

                const list = document.getElementById('lastLogins');
                list.innerHTML = '';
                if (data && data.length > 0) {
                    data.forEach(entry => {
                        const li = document.createElement('li');
                        li.className = "py-3 flex items-center justify-between";
                        li.innerHTML = `<span class="font-bold text-slate-700">${entry.username}</span> <span class="bg-blue-50 text-blue-600 text-[10px] font-black px-2 py-0.5 rounded-full uppercase">Ativo</span>`;
                        list.appendChild(li);
                    });
                } else {
                    list.innerHTML = '<li class="py-3 text-center text-slate-400 italic">Nenhum registro.</li>';
                }
            } catch (e) {
                console.error("Stats Error:", e);
                document.getElementById('totalVisits').innerText = "!";
            }
        }

        // Auth Operations
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const username = session.user.user_metadata.username || session.user.email;
                document.getElementById('dashUsername').innerText = username;
                showView('dashboardView');
                updateStats(username);
            } else {
                showView('loginView');
            }
        }

        // Handle Registration
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const gender = document.getElementById('regGender').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;

            if (password !== confirm) {
                alert("As senhas não coincidem!");
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: { data: { username, gender } }
            });

            if (error) {
                alert("Erro ao criar conta: " + error.message);
            } else {
                alert("Conta criada com sucesso! Verifique seu e-mail se necessário ou faça login.");
                showView('loginView');
            }
        });

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                alert("Erro ao entrar: " + error.message);
            } else {
                const username = data.user.user_metadata.username || data.user.email;
                document.getElementById('dashUsername').innerText = username;
                showView('dashboardView');
                updateStats(username);
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            location.reload();
        });

        // Initialization
        checkSession();
    </script>
</body>
</html>
