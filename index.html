<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Oliveira Apps Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: sans-serif; text-align: center; padding: 50px; }
        .card { border: 1px solid #0f0; padding: 20px; margin: 20px auto; max-width: 400px; background: #111; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        input { display: block; width: 80%; margin: 10px auto; padding: 10px; background: #222; color: #0f0; border: 1px solid #0f0; }
    </style>
</head>
<body>
    <h1>OLIVEIRA APPS - PORTAL 2026</h1>
    <div id="auth-status">Conectando...</div>
    
    <div id="login-form" class="card">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Senha">
        <button onclick="login()">Entrar</button>
    </div>

    <div id="locked-content" class="card" style="display:none">
        <h3>✅ Gravador Super v2 Pronto</h3>
        <p>Acesse o repositório para baixar o APK do Build #94.</p>
        <button onclick="window.location.href='https://github.com/guga13500-spec/oliveira-apps-portal'">Ir para Download</button>
    </div>

    <script>
        const supabaseClient = supabase.createClient('https://xioxooqytfxsjdoqghdu.supabase.co', 'sb_publishable_CAJTTExGFYQIzmNlF6N1Xw_QKqOBUFA');
        async function check() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const status = document.getElementById('auth-status');
            const form = document.getElementById('login-form');
            const content = document.getElementById('locked-content');
            if (user) {
                status.innerText = "Olá, " + user.email;
                form.style.display = 'none';
                content.style.display = 'block';
            } else {
                status.innerText = "Faça login para acessar os apps";
            }
        }
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else check();
        }
        window.onload = check;
    </script>
</body>
</html>
