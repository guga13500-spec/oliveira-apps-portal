<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliveira Apps | Portal v9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-cyan { background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); }
        .btn-red { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-md">
        <!-- Loading -->
        <div id="loading-view" class="text-center">
            <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-cyan-500 mx-auto"></div>
            <p class="mt-4 text-slate-400 font-medium">Sincronizando...</p>
        </div>

        <!-- Auth -->
        <div id="auth-view" class="hidden glass p-8 rounded-[2.5rem] shadow-2xl">
            <div class="text-center mb-10">
                <div class="w-20 h-20 bg-cyan-500/10 rounded-3xl flex items-center justify-center mx-auto mb-4 float">
                    <i class="fas fa-shield-alt text-4xl text-cyan-400"></i>
                </div>
                <h1 class="text-3xl font-black tracking-tighter">OLIVEIRA <span class="text-cyan-400">APPS</span></h1>
                <p class="text-slate-500 text-sm mt-1 uppercase tracking-widest font-bold">Portal Ultraleve v9</p>
            </div>
            
            <div class="space-y-4">
                <div class="relative">
                    <label class="text-[10px] font-black uppercase text-slate-500 ml-4 mb-1 block tracking-widest">Nome de Usuário</label>
                    <input type="text" id="username-input" placeholder="Digite seu nome..." 
                           class="w-full bg-slate-900/50 border border-white/5 rounded-2xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition-all text-lg font-medium">
                </div>
                <button onclick="handleAuth()" id="auth-btn" 
                        class="w-full btn-cyan py-5 rounded-2xl font-black text-lg shadow-lg shadow-cyan-500/20 hover:scale-[1.02] active:scale-95 transition-all uppercase tracking-tighter">
                    Entrar Agora
                </button>
            </div>
            <p id="auth-error" class="text-red-400 text-xs mt-6 text-center hidden font-medium bg-red-400/10 py-2 rounded-lg"></p>
        </div>

        <!-- Dashboard -->
        <div id="dashboard-view" class="hidden glass p-8 rounded-[2.5rem] shadow-2xl">
            <div class="flex items-center justify-between mb-10">
                <div>
                    <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Bem-vindo,</p>
                    <h2 id="display-username" class="text-3xl font-black text-cyan-400 truncate max-w-[200px]">...</h2>
                </div>
                <button onclick="logout()" class="w-12 h-12 rounded-2xl bg-slate-900/50 flex items-center justify-center text-slate-500 hover:text-white transition-colors">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>

            <div class="mb-10">
                <a id="download-btn" href="https://github.com/miolanatan9-debug/gravador-super-v2-final/actions/runs/26481920864" 
                   class="block w-full btn-red py-8 rounded-[2rem] text-center shadow-xl shadow-red-500/20 hover:scale-[1.02] active:scale-95 transition-all">
                    <i class="fas fa-download text-3xl mb-2 block"></i>
                    <span class="font-black text-2xl tracking-tighter uppercase">Baixar APK Super</span>
                    <span class="block text-xs opacity-70 font-bold mt-1">Build #94 - Verificado</span>
                </a>
            </div>

            <div class="space-y-4">
                <div class="flex justify-between items-center bg-cyan-500/5 p-5 rounded-3xl border border-cyan-500/10">
                    <span class="text-slate-400 font-bold text-sm">Total de Visitantes</span>
                    <span id="visitor-count" class="text-3xl font-black text-cyan-400">0</span>
                </div>

                <div class="bg-slate-900/50 rounded-3xl p-6 border border-white/5">
                    <h3 class="text-[10px] font-black uppercase text-slate-500 mb-4 tracking-widest">Atividade Recente</h3>
                    <div id="recent-list" class="space-y-3">
                        <!-- Items -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIG
        const SUPABASE_URL = 'https://xioxooqytfxsjdoqghdu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_CAJTTExGFYQIzmNlF6N1Xw_QKqOBUFA';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // UI REFS
        const views = {
            loading: document.getElementById('loading-view'),
            auth: document.getElementById('auth-view'),
            dashboard: document.getElementById('dashboard-view')
        };

        // APP LOGIC
        async function init() {
            const user = localStorage.getItem('oliveira_user');
            if (user) {
                await goDashboard(user);
            } else {
                showView('auth');
            }
        }

        async function handleAuth() {
            const username = document.getElementById('username-input').value.trim();
            if (!username) return;

            const btn = document.getElementById('auth-btn');
            const errorEl = document.getElementById('auth-error');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch animate-spin"></i>';
            errorEl.classList.add('hidden');

            try {
                // Registrar visita (Usando 'site_stats' se existir, senão ignora erro)
                await supabase.from('site_stats').insert([{ username: username, event: 'login' }]);
                
                localStorage.setItem('oliveira_user', username);
                await goDashboard(username);
            } catch (e) {
                console.error(e);
                // Mesmo com erro de banco, permite entrar (experiência ultraleve)
                localStorage.setItem('oliveira_user', username);
                await goDashboard(username);
            }
        }

        async function goDashboard(username) {
            showView('loading');
            document.getElementById('display-username').innerText = username;

            try {
                // Buscar Stats
                const { count } = await supabase.from('site_stats').select('*', { count: 'exact', head: true });
                document.getElementById('visitor-count').innerText = count || '0';

                // Buscar Recentes
                const { data } = await supabase.from('site_stats').select('username').order('id', { ascending: false }).limit(4);
                if (data) {
                    document.getElementById('recent-list').innerHTML = data.map(v => `
                        <div class="flex items-center gap-3 text-sm">
                            <div class="w-2 h-2 rounded-full bg-cyan-500 shadow-[0_0_8px_rgba(6,182,212,0.5)]"></div>
                            <span class="font-bold text-slate-300">@${v.username || 'visitante'}</span>
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.error("Modo Offline / Sem Banco");
            }

            showView('dashboard');
        }

        function showView(name) {
            Object.keys(views).forEach(v => views[v].classList.add('hidden'));
            views[name].classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('oliveira_user');
            location.reload();
        }

        function logout() {
            localStorage.removeItem('oliveira_user');
            location.reload();
        }

        init();
    </script>
</body>
</html>
