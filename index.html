<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliveira Apps | Portal de Acesso</title>
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary-color: #0066cc;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --error-color: #dc3545;
            --success-color: #28a745;
            --border-radius: 8px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .auth-container {
            background: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 1.5rem;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: 0.3s;
        }

        .tab.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            box-sizing: border-box;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(0,102,204,0.2);
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 1rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #0052a3;
        }

        .btn-google {
            background-color: white;
            color: #555;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            background-color: #f1f1f1;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 0.8rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .status-message {
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            margin-top: 1rem;
        }

        /* Dash Area */
        #dashboard {
            display: none;
            text-align: center;
        }

        .user-info {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #999;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="logo-area">
        <h1>OLIVEIRA APPS</h1>
    </div>

    <div id="auth-forms">
        <div class="tabs">
            <div class="tab active" id="tab-login" onclick="switchMode('login')">LOGIN</div>
            <div class="tab" id="tab-register" onclick="switchMode('register')">CADASTRO</div>
        </div>

        <div id="error-display" class="error-message"></div>

        <!-- LOGIN FORM -->
        <div id="login-section">
            <div class="form-group">
                <label>Usuário ou E-mail</label>
                <input type="text" id="login-id" placeholder="Ex: joao@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="login-pass" placeholder="Sua senha">
            </div>
            <div class="form-group">
                <label>Gênero</label>
                <select id="login-gender">
                    <option value="">Selecione...</option>
                    <option value="menino">Masculino (Menino)</option>
                    <option value="menina">Feminino (Menina)</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="handleAuth('login')">ENTRAR NO PORTAL</button>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-section" style="display: none;">
            <div class="form-group">
                <label>Nome completo</label>
                <input type="text" id="reg-name" placeholder="Como quer ser chamado?">
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="reg-email" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="form-group">
                <label>Confirmar Senha</label>
                <input type="password" id="reg-pass-confirm" placeholder="Repita a senha">
            </div>
            <div class="form-group">
                <label>Gênero</label>
                <select id="reg-gender">
                    <option value="">Selecione...</option>
                    <option value="menino">Masculino (Menino)</option>
                    <option value="menina">Feminino (Menina)</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="handleAuth('register')">CRIAR MINHA CONTA</button>
        </div>

        <div style="text-align: center; margin: 1rem 0; color: #999; font-size: 0.9rem;">OU</div>

        <button class="btn btn-google" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
            ENTRAR RÁPIDO COM GOOGLE
        </button>

        <p class="status-message" id="status-text">Status: Sistema Online</p>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard">
        <h2>ACESSO LIBERADO</h2>
        <div class="user-info">
            <p>Olá, <strong id="display-name">Usuário</strong>!</p>
            <p id="display-email" style="font-size: 0.9rem; color: #666;"></p>
        </div>
        <button class="btn btn-primary" onclick="window.location.href='https://github.com/miolanatan9-debug/gravador-super-v2-final/releases/latest'">BAIXAR GRAVADOR SUPER V2</button>
        <button class="btn" style="background: #eee;" onclick="logout()">SAIR DO SISTEMA</button>
    </div>

    <div class="footer">Oliveira Apps &copy; 2026 - Sinceridade Absoluta</div>
</div>

<script>
    // CONFIGURAÇÃO DO FIREBASE (Sera substituida)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Inicializa Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function switchMode(mode) {
        document.getElementById('login-section').style.display = mode === 'login' ? 'block' : 'none';
        document.getElementById('register-section').style.display = mode === 'register' ? 'block' : 'none';
        document.getElementById('tab-login').className = mode === 'login' ? 'tab active' : 'tab';
        document.getElementById('tab-register').className = mode === 'register' ? 'tab active' : 'tab';
        hideError();
    }

    function showError(msg) {
        const errDiv = document.getElementById('error-display');
        errDiv.innerText = msg;
        errDiv.style.display = 'block';
    }

    function hideError() {
        document.getElementById('error-display').style.display = 'none';
    }

    function handleAuth(mode) {
        hideError();
        if (mode === 'register') {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const confirm = document.getElementById('reg-pass-confirm').value;
            const gender = document.getElementById('reg-gender').value;

            if (!name || !email || !pass || !gender) return showError("Preencha todos os campos.");
            if (pass !== confirm) return showError("As senhas não coincidem.");
            if (pass.length < 6) return showError("A senha deve ter pelo menos 6 caracteres.");

            auth.createUserWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    const user = userCredential.user;
                    return db.collection("users").doc(user.uid).set({
                        name: name,
                        email: email,
                        gender: gender,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .catch(err => showError(translateError(err.code)));

        } else {
            const email = document.getElementById('login-id').value;
            const pass = document.getElementById('login-pass').value;
            const gender = document.getElementById('login-gender').value;

            if (!email || !pass || !gender) return showError("Preencha e-mail, senha e gênero.");

            auth.signInWithEmailAndPassword(email, pass)
                .catch(err => showError(translateError(err.code)));
        }
    }

    function loginWithGoogle() {
        hideError();
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider)
            .then((result) => {
                const user = result.user;
                // Salva ou atualiza no Firestore
                db.collection("users").doc(user.uid).set({
                    name: user.displayName,
                    email: user.email,
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            })
            .catch(err => showError(translateError(err.code)));
    }

    function translateError(code) {
        switch (code) {
            case 'auth/user-not-found': return "Usuário não cadastrado.";
            case 'auth/wrong-password': return "Senha incorreta.";
            case 'auth/invalid-email': return "E-mail inválido.";
            case 'auth/email-already-in-use': return "Este e-mail já está em uso.";
            case 'auth/weak-password': return "A senha é muito fraca.";
            case 'auth/popup-closed-by-user': return "A janela de login foi fechada.";
            default: return "Erro ao processar. Tente novamente.";
        }
    }

    function logout() {
        auth.signOut();
    }

    // Monitor de estado
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-forms').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('display-name').innerText = user.displayName || "Operador";
            document.getElementById('display-email').innerText = user.email;
            
            // Busca dados extras se houver
            db.collection("users").doc(user.uid).get().then(doc => {
                if (doc.exists) {
                    document.getElementById('display-name').innerText = doc.data().name;
                }
            });
        } else {
            document.getElementById('auth-forms').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }
    });

    // Detecta offline
    window.addEventListener('offline', () => {
        document.getElementById('status-text').innerText = "Status: Sem conexão (Offline)";
        document.getElementById('status-text').style.color = "red";
    });
    window.addEventListener('online', () => {
        document.getElementById('status-text').innerText = "Status: Sistema Online";
        document.getElementById('status-text').style.color = "#666";
    });
</script>

</body>
</html>
